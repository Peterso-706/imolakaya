services:
  - type: web
    name: imolakaya-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: imolakaya-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://imolakaya.vercel.app
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"

databases:
  - name: imolakaya-db
    databaseName: imolakaya
    user: imolakaya